# Weekly dependency updates: one grouped PR per ecosystem and directory (incl. major bumps).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Pub workspace: root pubspec.yaml + pubspec.lock cover all packages
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    versioning-strategy: increase
    groups:
      pub:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # One entry per directory: a multi-directory group fails to commit
  # changes that land outside the directory currently being updated.
  - package-ecosystem: gradle
    directory: /packages/audioplayers_android/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      gradle-android:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /packages/audioplayers_android_exo/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      gradle-android-exo:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: gradle
    directory: /packages/audioplayers/example/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      gradle-example:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # No swift entry: Package.swift only depends on the local, Flutter-generated
  # FlutterFramework package, which doesn't exist in the repository.
